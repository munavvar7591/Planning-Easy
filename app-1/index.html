<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PlanningEasy">
  <meta name="description" content="Simple All-in-One Management System for Organizations, Teams, and Groups">

  <title>PlanningEasy - All-in-One Group Management</title>

  <!-- PWA Manifest & Favicons -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Core Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="app">
    <!-- Top Header (Fixed) -->
    <header id="appHeader" class="app-header" style="display: none;">
      <div class="brand-wrapper">
        <div class="brand-logo">PE</div>
        <span class="brand-name">PlanningEasy</span>
      </div>

      <div class="header-actions">
        <!-- Notification Bell Button -->
        <button id="headerNotificationBtn" class="notification-bell-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width: 20px; height: 20px;"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span id="headerNotificationBadge" class="notification-badge" style="display: none;">0</span>
        </button>

        <span id="headerPresenceDot" class="presence-dot online" title="Online Presence"></span>
        <button id="profileAvatarBtn" class="profile-avatar-btn" title="My Account & Profile">
          <img id="userAvatarImg" src="" alt="Avatar" style="display: none; width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
          <span id="userAvatarInitial">A</span>
        </button>
      </div>
    </header>

    <!-- Main Content Dynamic View Container -->
    <main id="mainContent" class="main-content">
      <!-- Injected dynamically by app.js -->
    </main>

    <!-- Bottom Navigation Bar (Fixed) -->
    <nav id="bottomNav" class="bottom-nav" style="display: none;">
      <!-- Injected dynamically based on role (Admin: 5 tabs, Member: 4 tabs) -->
    </nav>

    <!-- Global Modal Backdrop & Sheet Container -->
    <div id="globalModalBackdrop" class="modal-backdrop">
      <div id="globalModalContent" style="width: 100%; display: flex; justify-content: center;"></div>
    </div>

    <!-- Full-Screen Media Viewer Modal -->
    <div id="fullScreenMediaModal" class="fullscreen-media-modal" style="display: none;">
      <div class="fullscreen-media-header">
        <span id="fullscreenMediaTitle" class="fullscreen-media-title">Media Viewer</span>
        <div style="display: flex; align-items: center; gap: 10px;">
          <button id="fullscreenMediaCloseBtn" class="fullscreen-close-btn" title="Close Viewer">&times;</button>
        </div>
      </div>
      <div class="fullscreen-media-body" id="fullscreenMediaBody">
        <!-- Dynamically injected img or video -->
      </div>
    </div>
  </div>

  <!-- Main JavaScript Application Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
